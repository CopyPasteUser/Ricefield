name: Linux release bundle

on:
  workflow_dispatch:
  push:
    # A reviewed version bump on main publishes only after the full bundle job.
    branches:
      - main
    paths:
      - Cargo.toml
      # Allows a reviewed workflow repair to retry an unpublished release.
      - .github/workflows/release.yml
    tags:
      - 'v0.3.*'
      - 'v0.4.*'
      - 'v0.5.*'
      - 'v0.6.*'
      - 'v0.7.*'
      - 'v0.8.*'
      - 'v0.9.*'
      - 'v1.0.*'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo dependencies and incremental build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ricefield-ubuntu-24.04-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ricefield-ubuntu-24.04-${{ runner.arch }}-cargo-
      - name: Linux development and GUI smoke dependencies
        run: |
          set -euo pipefail
          # Keep the publish path subject to the same finite hosted-runner
          # mirror retries as PR CI; a blocked mirror must fail visibly.
          for attempt in 1 2; do
            if timeout 150s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update &&
               timeout 180s sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgl1-mesa-dev xvfb xauth xdotool imagemagick libgl1-mesa-dri libxkbcommon-x11-0 libarchive13t64; then
              exit 0
            fi
            echo "Release dependencies failed on attempt $attempt; retrying if possible" >&2
            sleep 5
          done
          exit 1
      - name: Desktop launcher installation smoke
        run: bash scripts/test_desktop_entry.sh
      - name: Transactional install and rollback smoke
        run: bash scripts/test_install_transaction.sh
      - name: Desktop measurement retry contract
        run: bash scripts/test_ci_desktop_measurement.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - name: Native FileManager1 protocol on a private session bus
        run: dbus-run-session -- env RICEFIELD_TEST_BUS=1 cargo test --locked desktop::tests::private_bus_roundtrip_and_existing_owner_are_respected -- --ignored --exact
      - run: cargo build --locked --release
      - name: Disposable performance and desktop integration checks
        run: |
          target/release/ricefield --benchmark > performance-filesystem.toml
          timeout -k 5s 60s dbus-run-session -- env RICEFIELD_TEST_BUS=1 xvfb-run -a bash scripts/test_file_manager_service.sh
          timeout -k 5s 60s xvfb-run -a bash scripts/test_filters.sh
          bash scripts/run_ci_desktop_measurement.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ricefield-release-performance
          path: performance-*.toml
          if-no-files-found: error
      - name: CLI and seven-theme graphical smoke
        run: |
          target/release/ricefield --help
          target/release/ricefield --version
          target/release/ricefield --list-themes
          timeout -k 10s 8m xvfb-run -a -s '-screen 0 1280x800x24' bash scripts/gui_smoke.sh
      - name: Build and verify reproducible release bundle
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          bash scripts/package-release.sh target/release/ricefield dist
          bash scripts/package-release.sh target/release/ricefield dist-repeat
          (cd dist && sha256sum --check -- *.sha256)
          archive="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          cmp -- "$archive" "dist-repeat/$(basename "$archive")"
          unpack_dir="$(mktemp -d)"
          test_home="$(mktemp -d)"
          tar xzf "$archive" -C "$unpack_dir"
          bundle_dir="$(find "$unpack_dir" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          HOME="$test_home" bash "$bundle_dir/install.sh"
          HOME="$test_home" "$test_home/.local/bin/ricefield" --version
          HOME="$test_home" bash "$bundle_dir/uninstall.sh"
          test ! -e "$test_home/.local/bin/ricefield"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ricefield-release-bundle
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ricefield-release-gui-smoke
          path: screenshots/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v0.') || startsWith(github.ref, 'refs/tags/v1.0.') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve and verify the release tag
        id: release_tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          expected_tag="v$(sed -nE 's/^version = "([^"]+)"$/\1/p' Cargo.toml)"
          echo "tag=$expected_tag" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "$expected_tag"
          else
            test "$GITHUB_REF_NAME" = main
            [[ "$expected_tag" =~ ^v1\.0\.[0-9]+$ ]]
          fi

          # Re-running a version-bump workflow must never republish a release.
          if gh release view "$expected_tag" >/dev/null 2>&1; then
            echo 'already_published=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'already_published=false' >> "$GITHUB_OUTPUT"

          # A GitHub Actions-created tag deliberately does not recursively
          # trigger tag-push workflows; this job publishes its verified bundle.
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            # `gh api` can emit a JSON error body on stdout even when it
            # exits nonzero. Treat only an HTTP 404 as a missing reference.
            if tag_probe="$(gh api "repos/$GH_REPO/git/ref/tags/$expected_tag" 2>/dev/null)"; then
              echo "Release tag $expected_tag already exists without a published release; inspect manually." >&2
              exit 1
            fi
            probe_status="$(jq -r '.status // empty' <<< "$tag_probe" 2>/dev/null || true)"
            if [[ "$probe_status" != 404 ]]; then
              echo "Cannot verify that $expected_tag is absent (HTTP ${probe_status:-unknown}); refusing to create a tag." >&2
              exit 1
            fi
            annotated_sha="$(gh api -X POST "repos/$GH_REPO/git/tags" \
              -f tag="$expected_tag" \
              -f message="RiceField $expected_tag — owner-approved stable release" \
              -f object="$GITHUB_SHA" -f type=commit --jq '.sha')"
            gh api -X POST "repos/$GH_REPO/git/refs" \
              -f ref="refs/tags/$expected_tag" -f sha="$annotated_sha" >/dev/null
          fi
      - name: Download verified workflow bundle
        if: steps.release_tag.outputs.already_published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "$GITHUB_RUN_ID" --name ricefield-release-bundle --dir dist
      - name: Publish GitHub release from existing tag
        if: steps.release_tag.outputs.already_published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check -- *.sha256)
          tag="${{ steps.release_tag.outputs.tag }}"
          options=(--verify-tag --generate-notes)
          if [[ "$tag" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$tag" dist/*.tar.gz dist/*.sha256 "${options[@]}"

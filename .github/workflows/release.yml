name: Linux release bundle

on:
  workflow_dispatch:
  push:
    tags:
      - 'v0.3.*'
      - 'v0.4.*'
      - 'v0.5.*'
      - 'v0.6.*'
      - 'v0.7.*'
      - 'v0.8.*'
      - 'v0.9.*'
      - 'v1.0.*'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo dependencies and incremental build outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rice-explorer-ubuntu-24.04-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rice-explorer-ubuntu-24.04-${{ runner.arch }}-cargo-
      - name: Linux development and GUI smoke dependencies
        run: |
          set -euo pipefail
          # Keep the publish path subject to the same finite hosted-runner
          # mirror retries as PR CI; a blocked mirror must fail visibly.
          for attempt in 1 2; do
            if timeout 150s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update &&
               timeout 180s sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgl1-mesa-dev xvfb xauth xdotool imagemagick libgl1-mesa-dri libxkbcommon-x11-0 libarchive13t64; then
              exit 0
            fi
            echo "Release dependencies failed on attempt $attempt; retrying if possible" >&2
            sleep 5
          done
          exit 1
      - name: Desktop launcher installation smoke
        run: bash scripts/test_desktop_entry.sh
      - name: Transactional install and rollback smoke
        run: bash scripts/test_install_transaction.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - name: Native FileManager1 protocol on a private session bus
        run: dbus-run-session -- env RICE_EXPLORER_TEST_BUS=1 cargo test --locked desktop::tests::private_bus_roundtrip_and_existing_owner_are_respected -- --ignored --exact
      - run: cargo build --locked --release
      - name: Disposable performance and desktop integration checks
        run: |
          target/release/rice-explorer --benchmark > performance-filesystem.toml
          timeout -k 5s 60s dbus-run-session -- env RICE_EXPLORER_TEST_BUS=1 xvfb-run -a bash scripts/test_file_manager_service.sh
          timeout -k 5s 60s xvfb-run -a bash scripts/test_filters.sh
          timeout -k 5s 60s xvfb-run -a bash scripts/measure-desktop.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rice-explorer-release-performance
          path: performance-*.toml
          if-no-files-found: error
      - name: CLI and seven-theme graphical smoke
        run: |
          target/release/rice-explorer --help
          target/release/rice-explorer --version
          target/release/rice-explorer --list-themes
          timeout -k 10s 8m xvfb-run -a -s '-screen 0 1280x800x24' bash scripts/gui_smoke.sh
      - name: Build and verify reproducible release bundle
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          bash scripts/package-release.sh target/release/rice-explorer dist
          bash scripts/package-release.sh target/release/rice-explorer dist-repeat
          (cd dist && sha256sum --check -- *.sha256)
          archive="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          cmp -- "$archive" "dist-repeat/$(basename "$archive")"
          unpack_dir="$(mktemp -d)"
          test_home="$(mktemp -d)"
          tar xzf "$archive" -C "$unpack_dir"
          bundle_dir="$(find "$unpack_dir" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          HOME="$test_home" bash "$bundle_dir/install.sh"
          HOME="$test_home" "$test_home/.local/bin/rice-explorer" --version
          HOME="$test_home" bash "$bundle_dir/uninstall.sh"
          test ! -e "$test_home/.local/bin/rice-explorer"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rice-explorer-release-bundle
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rice-explorer-release-gui-smoke
          path: screenshots/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v0.') || startsWith(github.ref, 'refs/tags/v1.0.')
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate tag matches Cargo package version
        shell: bash
        run: |
          set -euo pipefail
          expected_tag="v$(sed -nE 's/^version = "([^"]+)"$/\1/p' Cargo.toml)"
          test "$GITHUB_REF_NAME" = "$expected_tag"
      - name: Download verified workflow bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "$GITHUB_RUN_ID" --name rice-explorer-release-bundle --dir dist
      - name: Publish GitHub release from existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check -- *.sha256)
          options=(--verify-tag --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 "${options[@]}"

name: SMB protocol safety
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  smb-hardlink:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install disposable Samba client and server
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends samba smbclient
      - name: Real SMB3 hardlink collision and staged-byte proof
        run: bash scripts/test_smb_atomicity.sh

name: Rust checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux graphics dependencies
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgl1-mesa-dev
      - run: cargo fmt --all
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-rust-source
          path: src
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: rice-explorer-linux-x86_64
          path: target/release/rice-explorer

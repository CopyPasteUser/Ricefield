name: Rust checks
# Linux runner network faults and Xvfb server exits must remain observable.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo dependencies and incremental build outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ricefield-ubuntu-24.04-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ricefield-ubuntu-24.04-${{ runner.arch }}-cargo-
      - name: Linux graphics dependencies
        run: |
          set -euo pipefail
          # Hosted runners can hang in the Ubuntu mirror; bound network waits
          # and retry a transient failure without leaving the CI job stuck.
          for attempt in 1 2; do
            if timeout 150s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update &&
               # No recommended Ghostscript/font bundles: ImageMagick's `import`
               # captures Xvfb windows without them. Hosted mirror downloads of
               # the optional 11 MB font bundle have repeatedly timed out.
               timeout 180s sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgl1-mesa-dev libarchive13t64 xvfb xauth xdotool imagemagick libgl1-mesa-dri libxkbcommon-x11-0; then
              exit 0
            fi
            echo "Graphics dependencies failed on attempt $attempt; retrying if possible" >&2
            sleep 5
          done
          exit 1
      - name: Desktop launcher installation smoke
        run: bash scripts/test_desktop_entry.sh
      - name: Transactional install and rollback smoke
        run: bash scripts/test_install_transaction.sh
      - name: Desktop measurement retry contract
        run: bash scripts/test_ci_desktop_measurement.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - name: Native FileManager1 protocol on a private session bus
        run: dbus-run-session -- env RICEFIELD_TEST_BUS=1 cargo test --locked desktop::tests::private_bus_roundtrip_and_existing_owner_are_respected -- --ignored --exact
      - run: cargo build --locked --release
      - name: Disposable 100k-entry and verified-copy benchmark
        run: target/release/ricefield --benchmark > performance-filesystem.toml
      - name: CLI smoke
        run: |
          target/release/ricefield --help
          target/release/ricefield --version
          target/release/ricefield --list-themes
      - name: Release bundle and menu launcher smoke
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          trap 'rm -r -- "$fixture"' EXIT
          mkdir -p "$fixture/dist" "$fixture/unpacked" "$fixture/home"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          bash scripts/package-release.sh target/release/ricefield "$fixture/dist"
          tar xzf "$fixture/dist/"*.tar.gz -C "$fixture/unpacked"
          bundle="$(find "$fixture/unpacked" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          HOME="$fixture/home" bash "$bundle/install.sh"
          test -f "$fixture/home/.local/share/applications/ricefield.desktop"
          HOME="$fixture/home" bash "$bundle/uninstall.sh"
          test ! -e "$fixture/home/.local/share/applications/ricefield.desktop"
      - name: Native GUI smoke (Xvfb software GL)
        run: |
          timeout -k 10s 8m xvfb-run -e /dev/stderr -a -s '-screen 0 1280x800x24' bash scripts/gui_smoke.sh
      - name: FileManager1 GUI and desktop measurements
        run: |
          timeout -k 5s 60s dbus-run-session -- env RICEFIELD_TEST_BUS=1 xvfb-run -a bash scripts/test_file_manager_service.sh
          timeout -k 5s 60s xvfb-run -a bash scripts/test_filters.sh
          bash scripts/run_ci_desktop_measurement.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ricefield-performance
          path: performance-*.toml
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ricefield-gui-smoke
          path: screenshots/
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ricefield-linux-x86_64
          path: target/release/ricefield

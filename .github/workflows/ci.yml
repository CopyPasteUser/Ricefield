name: Rust checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux graphics dependencies
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgl1-mesa-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - run: cargo build --release
      - name: CLI smoke
        run: |
          target/release/rice-explorer --help
          target/release/rice-explorer --list-themes
      - name: Native GUI smoke (Xvfb software GL)
        run: |
          sudo apt-get install -y xvfb xauth imagemagick libgl1-mesa-dri libxkbcommon-x11-0
          xvfb-run -a -s '-screen 0 1280x800x24' bash scripts/gui_smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rice-explorer-gui-smoke
          path: screenshots/
      - uses: actions/upload-artifact@v4
        with:
          name: rice-explorer-linux-x86_64
          path: target/release/rice-explorer

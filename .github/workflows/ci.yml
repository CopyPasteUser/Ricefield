name: Rust checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo dependencies and incremental build outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rice-explorer-ubuntu-latest-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rice-explorer-ubuntu-latest-${{ runner.arch }}-cargo-
      - name: Linux graphics dependencies
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgl1-mesa-dev libarchive13t64
      - name: Desktop launcher installation smoke
        run: bash scripts/test_desktop_entry.sh
      - name: Transactional install and rollback smoke
        run: bash scripts/test_install_transaction.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release
      - name: CLI smoke
        run: |
          target/release/rice-explorer --help
          target/release/rice-explorer --version
          target/release/rice-explorer --list-themes
      - name: Release bundle and menu launcher smoke
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          trap 'rm -r -- "$fixture"' EXIT
          mkdir -p "$fixture/dist" "$fixture/unpacked" "$fixture/home"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          bash scripts/package-release.sh target/release/rice-explorer "$fixture/dist"
          tar xzf "$fixture/dist/"*.tar.gz -C "$fixture/unpacked"
          bundle="$(find "$fixture/unpacked" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          HOME="$fixture/home" bash "$bundle/install.sh"
          test -f "$fixture/home/.local/share/applications/rice-explorer.desktop"
          HOME="$fixture/home" bash "$bundle/uninstall.sh"
          test ! -e "$fixture/home/.local/share/applications/rice-explorer.desktop"
      - name: Native GUI smoke (Xvfb software GL)
        run: |
          sudo apt-get install -y xvfb xauth xdotool imagemagick libgl1-mesa-dri libxkbcommon-x11-0
          xvfb-run -a -s '-screen 0 1280x800x24' bash scripts/gui_smoke.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rice-explorer-gui-smoke
          path: screenshots/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rice-explorer-linux-x86_64
          path: target/release/rice-explorer

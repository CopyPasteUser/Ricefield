[package]
name = "rice-explorer"
version = "0.4.0-alpha.1"
edition = "2024"
description = "A fast, themeable Linux file explorer built in Rust for RiceBowl"
license = "MIT"
repository = "https://github.com/CopyPasteUser/riceExplorer"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "clipboard", "accesskit"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1"
trash = "5.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
